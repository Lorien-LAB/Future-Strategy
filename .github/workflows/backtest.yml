name: Backtest validation
on:
  push:
    branches: [main, 'refactor/**']
    paths: ['backtest/**', 'pyproject.toml', '.github/workflows/backtest.yml']
  pull_request:
    paths: ['backtest/**', 'pyproject.toml', '.github/workflows/backtest.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev,charts]'
      - name: Compile source
        run: python -m compileall -q backtest
      - name: Unit, causal and end-to-end regression tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: CLI demo including charts
        run: python -m backtest demo --output "$RUNNER_TEMP/spread-demo" --run
      - name: CLI validation and nonempty result assertions
        run: |
          python -m backtest validate --config "$RUNNER_TEMP/spread-demo/config.json" --data-root "$RUNNER_TEMP/spread-demo/market" --specs "$RUNNER_TEMP/spread-demo/specs.csv"
          python -c "import json,os,pathlib; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'spread-demo'/'run'; m=json.loads((p/'cost_2bp'/'metrics.json').read_text()); assert m['entry_count']>0; assert (p/'charts'/'nav.png').is_file(); assert (p/'charts'/'drawdown.png').is_file()"
      - name: Save validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-validation-py${{ matrix.python-version }}
          path: |
            test-results.xml
            ${{ runner.temp }}/spread-demo/run/
          retention-days: 14
          if-no-files-found: warn
