[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "future-strategy-backtest"
version = "2.0.0"
description = "Auditable daily commodity calendar-spread research"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "pyarrow>=16"]

[project.optional-dependencies]
dev = ["pytest>=8"]
charts = ["matplotlib>=3.8"]

[project.scripts]
spread-backtest = "backtest.__main__:main"

[tool.setuptools.packages.find]
include = ["backtest"]

[tool.setuptools.package-data]
backtest = ["configs/*.json", "assets/*.csv", "docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["backtest/tests"]
addopts = "-ra"
